apiVersion: v1
description: NONRTRIC Common templates for inclusion in other charts
name: nonrtric-common
version: 2.0.0

dependencies:
  - name: a1controller
    version: "~2.1.6"
    repository: "http://nexus3.onap.org:10002/onap"
    condition: nonrtric.installA1controller

  - name: a1simulator
    version: "~2.6.1"
    repository: "http://nexus3.o-ran-sc.org:10002/o-ran-sc"
    condition: nonrtric.installA1simulator

  - name: controlpanel
    version: "~2.5.0"
    repository: "http://nexus3.o-ran-sc.org:10002/o-ran-sc"
    condition: nonrtric.installControlpanel

  - name: policymanagementservice
    version: "~2.7.0"
    repository: "http://nexus3.o-ran-sc.org:10002/o-ran-sc"
    condition: nonrtric.installPms

  - name: informationservice
    version: "~1.6.0"
    repository: "http://nexus3.o-ran-sc.org:10002/o-ran-sc"
    condition: nonrtric.installInformationservice

  - name: rappcatalogueservice
    version: "~1.2.0"
    repository: "http://nexus3.o-ran-sc.org:10002/o-ran-sc"
    condition: nonrtric.installRappcatalogueservice

  - name: rappcatalogueenhancedservice
    version: "~1.1.0"
    repository: "http://nexus3.o-ran-sc.org:10002/o-ran-sc"
    condition: nonrtric.installRappcatalogueenhancedservice

  - name: nonrtricgateway
    version: "~1.2.0"
    repository: "http://nexus3.o-ran-sc.org:10002/o-ran-sc"
    condition: nonrtric.installNonrtricgateway

  - name: dmaapadapterservice
    version: "~1.3.0"
    repository: "http://nexus3.o-ran-sc.org:10002/o-ran-sc"
    condition: nonrtric.installDmaapadapterservice

  - name: dmaapmediatorservice
    version: "~1.2.0"
    repository: "http://nexus3.o-ran-sc.org:10002/o-ran-sc"
    condition: nonrtric.installDmaapmediatorservice
  
  - name: helmmanager
    version: "~1.3.0"
    repository: "http://nexus3.o-ran-sc.org:10002/o-ran-sc"
    condition: nonrtric.installHelmmanager

  - name: ransliceassurance
    version: "~1.3.0"
    repository: "http://nexus3.o-ran-sc.org:10002/o-ran-sc"
    condition: nonrtric.installRansliceassurance

  - name: orufhrecovery
    version: "~1.1.0"
    repository: "http://nexus3.o-ran-sc.org:10002/o-ran-sc"
    condition: nonrtric.installOrufhrecovery

  - name: capifcore
    version: "~1.3.1"
    repository: "http://nexus3.o-ran-sc.org:10004/o-ran-sc"
    condition: nonrtric.installCapifcore

  - name: servicemanager
    version: "~0.1.2"
    repository: "http://nexus3.o-ran-sc.org:10004/o-ran-sc"
    condition: nonrtric.installServicemanager

  - name: rappmanager
    version: "~0.0.1"
    repository: "http://nexus3.o-ran-sc.org:10002/o-ran-sc"
    condition: nonrtric.installrAppmanager

  - name: dmeparticipant
    version: "~0.0.1"
    repository: "http://nexus3.o-ran-sc.org:10002/o-ran-sc"
    condition: nonrtric.installDmeParticipant
